name: release-gate
on:
  workflow_dispatch:
jobs:
  functional-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install -r apps/api/requirements.txt ruff
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api
      - run: python scripts/e2e_production_like.py
      - run: python -m compileall -q apps/api/app apps/api/alembic
      - run: ruff check --select F apps/api/app apps/api/tests scripts
      - run: npm ci
        working-directory: apps/miniprogram
      - run: npm run build
        working-directory: apps/miniprogram
      - run: find apps/wechat-miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
  wechat-code-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_wechat_release.py --code-only
