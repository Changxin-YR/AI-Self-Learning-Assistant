services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: study_agent
      MYSQL_USER: study_agent
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: root-change-me
    ports: ["${MYSQL_HOST_PORT:-3306}:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["${QDRANT_HOST_PORT:-6333}:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me
    ports: ["${MINIO_HOST_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio_data:/data"]
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${E2E_BASE_IMAGE:-python:3.12-slim}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+pymysql://study_agent:change-me@mysql:3306/study_agent
      DEV_MODE: "false"
      JWT_SECRET: ${JWT_SECRET:-replace-with-random-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-h5-domain.example}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: study-agent
      S3_REGION: ${S3_REGION:-us-east-1}
      VECTOR_PROVIDER: qdrant
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-study_chunks}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      TEST_LLM_PROVIDER: ${TEST_LLM_PROVIDER:-false}
      CONTENT_SAFETY_PROVIDER: ${CONTENT_SAFETY_PROVIDER:-external}
      TEST_LOGIN_PROVIDER: ${TEST_LOGIN_PROVIDER:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    ports: ["${API_HOST_PORT:-8000}:8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
  celery-worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${E2E_BASE_IMAGE:-python:3.12-slim}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+pymysql://study_agent:change-me@mysql:3306/study_agent
      DEV_MODE: "false"
      JWT_SECRET: ${JWT_SECRET:-replace-with-random-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-h5-domain.example}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: study-agent
      S3_REGION: ${S3_REGION:-us-east-1}
      VECTOR_PROVIDER: qdrant
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-study_chunks}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      TEST_LLM_PROVIDER: ${TEST_LLM_PROVIDER:-false}
      CONTENT_SAFETY_PROVIDER: ${CONTENT_SAFETY_PROVIDER:-external}
      TEST_LOGIN_PROVIDER: ${TEST_LOGIN_PROVIDER:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "documents,cleanup", "--loglevel=info"]
    depends_on: [api, redis, qdrant, minio]
volumes:
  mysql_data:
  qdrant_data:
  minio_data:
