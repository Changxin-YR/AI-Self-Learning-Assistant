services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: study_agent
      MYSQL_USER: study_agent
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: root-change-me
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: ../apps/api
    env_file: ../.env
    environment:
      DATABASE_URL: mysql+pymysql://study_agent:change-me@mysql:3306/study_agent
      DEV_MODE: "false"
      STORAGE_PROVIDER: s3
      VECTOR_PROVIDER: qdrant
    ports: ["8000:8000"]
    depends_on: [mysql, redis, qdrant, minio]
  celery-worker:
    build: ../apps/api
    env_file: ../.env
    environment:
      DATABASE_URL: mysql+pymysql://study_agent:change-me@mysql:3306/study_agent
      DEV_MODE: "false"
      STORAGE_PROVIDER: s3
      VECTOR_PROVIDER: qdrant
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "documents", "--loglevel=info"]
    depends_on: [api, redis, qdrant, minio]
volumes:
  mysql_data:
  qdrant_data:
  minio_data:
